name: GameStop Squeeze Bot

on:
  schedule:
    # Corre de lunes a viernes a las 21:30 UTC (17:30 ET, después del cierre de mercado)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: gamestop-squeeze/requirements.txt

      - name: Instalar dependencias
        run: pip install -r gamestop-squeeze/requirements.txt

      - name: Scanner mensual (corre el 1ro de cada mes)
        working-directory: gamestop-squeeze
        run: |
          if [ "$(date +%d)" = "01" ]; then
            echo "=== Primer día del mes: ejecutando scanner ==="
            python run.py --scan
          else
            echo "=== No es el 1ro del mes, saltando scanner ==="
          fi

      - name: Update diario
        working-directory: gamestop-squeeze
        run: python run.py --update

      - name: Guardar cambios al repo
        run: |
          git config --local user.email "bot@github-actions"
          git config --local user.name "GameStop Squeeze Bot"
          git add "gamestop-squeeze/data/portfolio.json"
          git diff --staged --quiet || git commit -m "bot: portfolio update $(date -u +'%Y-%m-%d')"
          git push
