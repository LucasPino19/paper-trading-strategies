name: Paper Trading Bots

on:
  schedule:
    # Trump bot: cada hora en días hábiles, 13:00–21:00 UTC (9AM-5PM ET)
    - cron: '0 13-21 * * 1-5'
    # GameStop bot: días hábiles a las 21:30 UTC (cierre de mercado)
    - cron: '30 21 * * 1-5'
    # FVG: días hábiles a las 13:30 UTC (9:30 AM ET = apertura, backtest óptimo)
    - cron: '30 13 * * 1-5'
    # ICT: días hábiles a las 18:30 UTC (14:30 PM ET, backtest óptimo)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:  # permite correr manualmente desde GitHub

permissions:
  contents: write

jobs:
  trump-bot:
    name: Trump Sentiment Bot
    runs-on: ubuntu-latest
    # Corre en todas las ejecuciones programadas excepto la de las 21:30 (esa es del GameStop bot)
    if: github.event.schedule != '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trump-strategy/requirements.txt

      - name: Instalar dependencias
        run: pip install -r trump-strategy/requirements.txt

      - name: Correr Trump bot
        working-directory: trump-strategy
        run: python bot.py

      - name: Guardar portfolio
        run: |
          git config --local user.email "bot@github-actions"
          git config --local user.name "Paper Trading Bot"
          git add trump-strategy/data/portfolio.json trump-strategy/data/processed_articles.json
          git diff --staged --quiet || git commit -m "bot(trump): update $(date -u +'%Y-%m-%d %H:%M')"
          git push

  gamestop-bot:
    name: GameStop Squeeze Bot
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: gamestop-squeeze/requirements.txt

      - name: Instalar dependencias
        run: pip install -r gamestop-squeeze/requirements.txt

      - name: Scanner mensual (solo el 1ro de cada mes)
        working-directory: gamestop-squeeze
        run: |
          if [ "$(date +%d)" = "01" ]; then
            python run.py --scan
          fi

      - name: Update diario
        working-directory: gamestop-squeeze
        run: python run.py --update

      - name: Guardar portfolio
        run: |
          git config --local user.email "bot@github-actions"
          git config --local user.name "Paper Trading Bot"
          git add gamestop-squeeze/data/portfolio.json
          git diff --staged --quiet || git commit -m "bot(gamestop): update $(date -u +'%Y-%m-%d')"
          git push

  fvg-bot:
    name: FVG Strategy Bot
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      - name: Correr FVG bot
        working-directory: fvg-strategy
        run: python bot.py

      - name: Guardar portfolio
        run: |
          git config --local user.email "bot@github-actions"
          git config --local user.name "Paper Trading Bot"
          git add fvg-strategy/data/portfolio.json
          git diff --staged --quiet || git commit -m "bot(fvg): update $(date -u +'%Y-%m-%d')"
          git push

  ict-bot:
    name: ICT Strategy Bot
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 18 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      - name: Correr ICT bot
        working-directory: ict-strategy
        run: python bot.py

      - name: Guardar portfolio
        run: |
          git config --local user.email "bot@github-actions"
          git config --local user.name "Paper Trading Bot"
          git add ict-strategy/data/portfolio.json
          git diff --staged --quiet || git commit -m "bot(ict): update $(date -u +'%Y-%m-%d')"
          git push
